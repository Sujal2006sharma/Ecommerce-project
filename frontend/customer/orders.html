<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Customer Store</title>
    <link rel="stylesheet" href="../admin/admin.css">
    <style>
        .store-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 1.25rem 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .orders-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .order-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .status-badge {
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .order-details-grid {
            background: #f8fafc;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 0.9rem;
            border: 1px solid #e2e8f0;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body style="background-color: #f8fafc; margin: 0; padding: 0;">

<div class="admin-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <span class="logo-icon">🛒</span>
                <span>Customer Store</span>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-link"><span class="sidebar-icon">🛍️</span> Shop Catalog</a>
                <a href="orders.html" class="sidebar-link active"><span class="sidebar-icon">📦</span> My Orders</a>
            </nav>
        </div>
        <div style="padding: 1.5rem;">
            <button onclick="logoutUser()" class="sidebar-logout">🚪 Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="store-topbar">
            <div>
                <span style="font-size: 0.85rem; color: #64748b; font-weight: 600;">PURCHASE HISTORY</span>
                <h1 style="margin: 0; font-size: 1.6rem; color: #0f172a;">My Orders</h1>
            </div>

            <!-- NAVBAR PROFILE DISPLAY -->
            <div class="user-profile-menu" style="display: flex; align-items: center; gap: 10px; background: #f1f5f9; padding: 6px 14px; border-radius: 30px; border: 1px solid #e2e8f0;">
                <div class="profile-avatar" id="profileAvatar" style="width: 34px; height: 34px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem;">U</div>
                <div class="profile-info" style="display: flex; flex-direction: column;">
                    <span id="navUserName" style="font-weight: 700; font-size: 0.85rem; color: #0f172a;">Loading...</span>
                    <span id="navUserRole" style="font-size: 0.7rem; color: #64748b; font-weight: 600;">Customer</span>
                </div>
            </div>
        </header>

        <!-- ORDERS LIST -->
        <section class="orders-container" id="ordersContainer">
            <p style="text-align: center; color: #64748b; padding: 3rem; font-weight: 600;">Fetching your order history...</p>
        </section>
    </main>
</div>

<script src="../shared/auth.js"></script>
<script src="orders.js"></script>
</body>
</html>
