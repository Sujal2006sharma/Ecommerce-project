<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Storefront</title>
    <link rel="stylesheet" href="../admin/admin.css">
    <style>
        .store-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 1.25rem 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .category-pills {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .pill-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 0.6rem 1.4rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .pill-btn.active, .pill-btn:hover {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.75rem;
        }

        .product-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }

        .product-image-container {
            width: 100%;
            height: 220px;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.04);
        }

        .stock-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .stock-tag.in-stock {
            background: #dcfce7;
            color: #15803d;
        }

        .stock-tag.out-stock {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* MULTI-IMAGE GALLERY THUMBNAILS */
        .product-thumbnails {
            display: flex;
            gap: 8px;
            padding: 10px 14px 0 14px;
            background: #ffffff;
            overflow-x: auto;
        }

        .thumbnail-img {
            width: 46px;
            height: 46px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .thumbnail-img:hover {
            border-color: #93c5fd;
        }

        .thumbnail-img.active {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-category {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0.35rem 0 0.75rem 0;
        }

        .product-bottom {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #f1f5f9;
        }

        .product-price {
            font-size: 1.35rem;
            font-weight: 800;
            color: #2563eb;
        }

        .add-cart-btn {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            padding: 0.65rem 1.2rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .add-cart-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* CART DRAWER SIDEBAR */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100vh;
            background: #ffffff;
            box-shadow: -6px 0 25px rgba(0, 0, 0, 0.15);
            z-index: 1050;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
        }

        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1040;
            display: none;
        }

        .cart-overlay.show {
            display: block;
        }
    </style>
</head>
<body style="background-color: #f8fafc; margin: 0; padding: 0;">

<div class="admin-layout">
    <!-- PERMANENT SIDEBAR -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <span class="logo-icon">🛒</span>
                <span>Customer Store</span>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-link active"><span class="sidebar-icon">🛍️</span> Shop Catalog</a>
                <a href="orders.html" class="sidebar-link"><span class="sidebar-icon">📦</span> My Orders</a>
            </nav>
        </div>
        <div style="padding: 1.5rem;">
            <button onclick="logoutUser()" class="sidebar-logout">🚪 Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="store-topbar">
            <div>
                <span style="font-size: 0.85rem; color: #64748b; font-weight: 600;">CUSTOMER PORTAL</span>
                <h1 style="margin: 0; font-size: 1.6rem; color: #0f172a;">Explore Products</h1>
            </div>
            <button onclick="toggleCart()" style="background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; border: none; padding: 0.75rem 1.4rem; border-radius: 12px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>
        </header>

        <!-- CATEGORY PILLS -->
        <div class="category-pills" id="categoryPills">
            <button class="pill-btn active" onclick="filterByCategory('ALL', this)">All Products</button>
        </div>

        <!-- PRODUCT CATALOG GRID -->
        <section class="product-grid" id="productGrid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: #64748b; font-weight: 600;">Loading shop catalog...</div>
        </section>
    </main>
</div>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
        <h3 style="margin: 0; font-size: 1.25rem; color: #0f172a; font-weight: 700;">Your Shopping Cart</h3>
        <button onclick="toggleCart()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
        <p style="text-align: center; color: #64748b; margin-top: 3rem; font-size: 0.95rem;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin-bottom: 1.25rem; color: #0f172a;">
            <span>Total Amount:</span>
            <span id="cartTotal">₹0</span>
        </div>
        <button id="checkoutBtn" onclick="checkoutOrder()" style="width: 100%; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 1rem; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1.05rem; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.25);">
            Place Order Now
        </button>
    </div>
</div>

<script src="../shared/auth.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
