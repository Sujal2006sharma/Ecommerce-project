<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Shop & Dashboard</title>
    <link rel="stylesheet" href="../admin/admin.css">
    <style>
        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 1.2rem 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }
        .category-pills {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        .pill-btn {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 0.5rem 1.25rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #4b5563;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .pill-btn.active, .pill-btn:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #f3f4f6;
        }
        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .product-category {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0.25rem 0 0.5rem 0;
        }
        .product-bottom {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.75rem;
            border-top: 1px solid #f3f4f6;
        }
        .product-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: #2563eb;
        }
        .add-cart-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .add-cart-btn:hover {
            background: #1d4ed8;
        }
        .add-cart-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: #ffffff;
            box-shadow: -4px 0 15px rgba(0,0,0,0.15);
            z-index: 1050;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open {
            right: 0;
        }
        .cart-header {
            padding: 1.25rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f3f4f6;
        }
        .cart-footer {
            padding: 1.25rem;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1040;
            display: none;
        }
        .cart-overlay.show {
            display: block;
        }
    </style>
</head>
<body style="background-color: #f3f4f6; margin: 0; padding: 0;">

<div class="admin-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <span class="logo-icon">🛒</span>
                <span>Customer Portal</span>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-link active"><span class="sidebar-icon">🛍️</span> Shop Store</a>
                <a href="orders.html" class="sidebar-link"><span class="sidebar-icon">📦</span> My Orders</a>
            </nav>
        </div>
        <div style="padding: 1.5rem;">
            <button onclick="logoutUser()" class="sidebar-logout">🚪 Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOPBAR -->
        <header class="customer-header">
            <div>
                <span style="font-size: 0.85rem; color: #6b7280; font-weight: 600;">CUSTOMER DASHBOARD</span>
                <h1 style="margin: 0; font-size: 1.5rem; color: #1f2937;">Explore Products</h1>
            </div>
            <button onclick="toggleCart()" style="background: #2563eb; color: white; border: none; padding: 0.65rem 1.25rem; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>
        </header>

        <!-- CATEGORY PILLS -->
        <div class="category-pills" id="categoryPills">
            <button class="pill-btn active" onclick="filterByCategory('ALL', this)">All Products</button>
        </div>

        <!-- PRODUCT CATALOG GRID -->
        <section class="product-grid" id="productGrid">
            <div style="grid-column: span 3; text-align: center; padding: 3rem; color: #6b7280;">Loading products...</div>
        </section>
    </main>
</div>

<!-- CART SIDEBAR DRAWER -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
        <h3 style="margin: 0; font-size: 1.2rem; color: #1f2937;">Your Shopping Cart</h3>
        <button onclick="toggleCart()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
        <p style="text-align: center; color: #6b7280; margin-top: 2rem;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; margin-bottom: 1rem; color: #1f2937;">
            <span>Total Amount:</span>
            <span id="cartTotal">₹0</span>
        </div>
        <button id="checkoutBtn" onclick="checkoutOrder()" style="width: 100%; background: #22c55e; color: white; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem;">
            Place Order Now
        </button>
    </div>
</div>

<script src="../shared/auth.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
