<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Storefront - Explore Products</title>
    <link rel="stylesheet" href="/frontend/style.css">
    <link rel="stylesheet" href="/frontend/customer/customer.css">
</head>
<body style="margin: 0; background: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; min-height: 100vh;">

    <!-- SIDEBAR -->
    <aside style="width: 240px; background: #1e293b; color: #ffffff; padding: 1.5rem 1rem; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; flex-shrink: 0;">
        <div>
            <!-- LOGO -->
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 2.5rem; padding-left: 0.5rem;">
                <div style="width: 32px; height: 32px; background: #4f46e5; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold;">🛒</div>
                <span style="font-weight: 700; font-size: 0.95rem; color: #cbd5e1;">Customer Store</span>
            </div>

            <!-- MENU ITEMS -->
            <nav style="display: flex; flex-direction: column; gap: 8px;">
                <a href="/frontend/customer/dashboard.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #4f46e5; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 0.9rem;">
                    🛍️ Shop Catalog
                </a>
                <a href="#" onclick="handleMyOrdersClick(event)" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #94a3b8; text-decoration: none; border-radius: 10px; font-weight: 500; font-size: 0.9rem; transition: background 0.2s;">
                    📦 My Orders
                </a>
            </nav>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main style="flex: 1; padding: 2rem; box-sizing: border-box; overflow-y: auto;">
        
        <!-- HEADER BAR CARD -->
        <header style="background: #ffffff; border-radius: 16px; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); margin-bottom: 2rem;">
            <div>
                <span style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Customer Portal</span>
                <h1 style="margin: 4px 0 0 0; color: #0f172a; font-size: 1.5rem;">Explore Products</h1>
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <!-- USER BADGE -->
                <div id="userBadge" onclick="handleAuthAction()" style="display: flex; align-items: center; gap: 10px; background: #e0e7ff; padding: 6px 14px; border-radius: 30px; cursor: pointer;">
                    <div id="badgeAvatar" style="width: 28px; height: 28px; border-radius: 50%; background: #4f46e5; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem;">G</div>
                    <div style="line-height: 1.1;">
                        <span id="badgeName" style="font-weight: 700; color: #1e1b4b; font-size: 0.8rem; display: block;">Guest</span>
                        <span id="badgeRole" style="font-size: 0.65rem; color: #4338ca; font-weight: 700; display: block;">GUEST</span>
                    </div>
                </div>

                <!-- CART BUTTON -->
                <button onclick="toggleCart()" style="background: #3b82f6; color: #ffffff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                    🛒 Cart ( <span id="cartCount">0</span> )
                </button>
            </div>
        </header>

        <!-- CATEGORY PILLS -->
        <div id="categoryPills" style="display: flex; gap: 10px; margin-bottom: 2rem; flex-wrap: wrap;"></div>

        <!-- PRODUCTS GRID -->
        <div id="productGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
            <p style="text-align: center; color: #64748b; grid-column: 1 / -1;">Loading products...</p>
        </div>
    </main>

    <!-- SHOPPING CART DRAWER & OVERLAY -->
    <div id="cartOverlay" onclick="closeAllModals()" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); z-index: 999;"></div>
    
    <div id="cartDrawer" style="position: fixed; top: 0; right: -400px; width: 360px; height: 100%; background: #ffffff; z-index: 1000; transition: right 0.3s ease; padding: 1.5rem; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 1rem;">
            <h2 style="margin: 0; color: #0f172a; font-size: 1.25rem;">Shopping Cart</h2>
            <button onclick="toggleCart()" style="background: none; border: none; font-size: 1.25rem; cursor: pointer; color: #64748b;">✕</button>
        </div>
        <div id="cartItems" style="flex: 1; overflow-y: auto;"></div>
        <div style="border-top: 1px solid #e2e8f0; padding-top: 1rem; margin-top: 1rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: 700; font-size: 1.1rem; color: #0f172a;">
                <span>Total:</span>
                <span id="cartTotal">₹0</span>
            </div>
            <button onclick="handleCheckoutClick()" style="width: 100%; background: #ffc107; color: #000000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem;">
                Proceed to Checkout
            </button>
        </div>
    </div>

    <!-- IN-PAGE LOGIN POPUP MODAL -->
    <div id="loginRequiredModal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: #ffffff; border-radius: 16px; width: 380px; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; position: relative;">
            
            <button onclick="closeLoginModal()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b;">✕</button>

            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="width: 50px; height: 50px; background: #e0e7ff; color: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.75rem auto;">🔑</div>
                <h2 style="margin: 0; color: #0f172a; font-size: 1.35rem;">Sign In Required</h2>
                <p style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">Log in to complete your purchase</p>
            </div>

            <form id="popupLoginForm" onsubmit="handlePopupLogin(event)">
                <div style="margin-bottom: 1rem; text-align: left;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 4px;">Username</label>
                    <input type="text" id="popupUsername" required placeholder="Enter username" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; outline: none; font-size: 0.9rem;">
                </div>

                <div style="margin-bottom: 1.25rem; text-align: left;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 4px;">Password</label>
                    <input type="password" id="popupPassword" required placeholder="Enter password" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; outline: none; font-size: 0.9rem;">
                </div>

                <p id="popupLoginError" style="display: none; color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; font-weight: 600;"></p>

                <button type="submit" style="width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">
                    Login & Complete Checkout
                </button>
            </form>

            <p style="font-size: 0.85rem; color: #64748b; margin-top: 1.25rem; text-align: center;">
                Don't have an account? <a href="/frontend/auth/register.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">Register</a>
            </p>
        </div>
    </div>

    <!-- SCRIPT INCLUDES -->
    <script src="/frontend/shared/auth.js"></script>
    <script src="/frontend/customer/dashboard.js"></script>
</body>
</html>
