<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Products
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


    <!-- ============================================= -->
    <!-- NAVBAR -->
    <!-- ============================================= -->

    <nav class="navbar">

        <div class="logo">
            Admin Panel
        </div>


        <div class="nav-right">

            <a
                href="dashboard.html"
                class="nav-link"
            >
                Dashboard
            </a>


            <a
                href="categories.html"
                class="nav-link"
            >
                Categories
            </a>


            <span id="userInfo">
                Loading...
            </span>


            <button
                type="button"
                class="logout-btn"
                onclick="logoutUser()"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- ============================================= -->
    <!-- MAIN -->
    <!-- ============================================= -->

    <div class="dashboard-container">


        <!-- HEADER -->

        <div class="dashboard-header">

            <div>

                <h1>
                    Products
                </h1>

                <p>
                    Manage all products.
                </p>

            </div>


            <button
                type="button"
                id="addProductButton"
            >
                + Add Product
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- PRODUCTS TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="productTableBody">

                    <tr>

                        <td
                            colspan="7"
                            class="loading-cell"
                        >
                            Loading products...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


    <!-- ============================================= -->
    <!-- ADD / EDIT PRODUCT MODAL -->
    <!-- ============================================= -->

    <div
        id="productModal"
        class="modal"
    >

        <div class="modal-content">


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Product
                </h2>


                <button
                    type="button"
                    id="closeProductModal"
                    class="close-btn"
                >
                    ×
                </button>

            </div>


            <!-- PRODUCT FORM -->

            <form id="productForm">


                <!-- PRODUCT ID -->

                <input
                    type="hidden"
                    id="productId"
                >


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label
                        for="productName"
                    >
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label
                        for="productPrice"
                    >
                        Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        step="0.01"
                        min="0"
                        placeholder="Enter price"
                        required
                    >

                </div>


                <!-- QUANTITY -->

                <div class="form-group">

                    <label
                        for="productQuantity"
                    >
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="productQuantity"
                        min="0"
                        placeholder="Enter quantity"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label
                        for="productCategory"
                    >
                        Category
                    </label>

                    <select
                        id="productCategory"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                    </select>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="saveProductButton"
                >
                    Save Product
                </button>


            </form>

        </div>

    </div>


    <!-- SHARED AUTH -->

    <script
        src="../shared/auth.js"
    ></script>


    <!-- PRODUCTS JS -->

    <script
        src="products.js"
    ></script>


</body>

</html>
